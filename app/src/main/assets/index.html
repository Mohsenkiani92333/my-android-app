<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="phaser.min.js"></script>
    <script src="socket.io.min.js"></script>
    <style> 
        body { margin: 0; padding: 0; overflow: hidden; background-color: #2c3e50; color: white; font-family: sans-serif; } 
        #status { position: absolute; top: 20px; left: 20px; z-index: 999; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; font-size: 14px; }
        #error-log { color: #ff6b6b; position: absolute; top: 80px; left: 20px; z-index: 999; font-size: 12px; max-width: 90%; }
    </style>
</head>
<body>
    <div id="status">⏳ در حال اتصال به سرور...</div>
    <div id="error-log"></div>
    <script>
        window.onerror = function(msg, url, line) {
            document.getElementById('error-log').innerHTML += "خطا: " + msg + "<br>";
        };

        const statusDiv = document.getElementById('status');
        const socket = io("http://localhost:3000"); 

        socket.on("connect", () => {
            statusDiv.innerHTML = "✅ به سرور وصل شد!";
            statusDiv.style.color = "#4ade80";
        });

        socket.on("connect_error", (err) => {
            statusDiv.innerHTML = "❌ خطا در اتصال به سرور! آیا ترمیوکس باز است؟";
            statusDiv.style.color = "#ef4444";
            document.getElementById('error-log').innerHTML += "جزئیات: " + err.message + "<br>";
        });

        let config = {
            type: Phaser.CANVAS, // تغییر به Canvas برای سازگاری بهتر با گوشی‌ها
            width: window.innerWidth,
            height: window.innerHeight,
            scene: { create: create, update: update }
        };
        let game = new Phaser.Game(config);
        let myPlayer, otherPlayers = {};
        let targetX, targetY;

        function create() {
            this.input.on('pointerdown', function (pointer) {
                targetX = pointer.x;
                targetY = pointer.y;
            });

            socket.on('currentPlayers', function (players) {
                Object.keys(players).forEach(function (id) {
                    if (id === socket.id) {
                        myPlayer = this.add.circle(players[id].x, players[id].y, 20, players[id].color);
                        targetX = myPlayer.x; targetY = myPlayer.y;
                    } else {
                        otherPlayers[id] = this.add.circle(players[id].x, players[id].y, 20, players[id].color);
                    }
                }, this);
            });

            socket.on('newPlayer', function (playerInfo) {
                otherPlayers[playerInfo.id] = this.add.circle(playerInfo.x, playerInfo.y, 20, playerInfo.color);
            });

            socket.on('playerMoved', function (playerInfo) {
                if (otherPlayers[playerInfo.id]) {
                    otherPlayers[playerInfo.id].x = playerInfo.x;
                    otherPlayers[playerInfo.id].y = playerInfo.y;
                }
            });

            socket.on('playerDisconnected', function (playerId) {
                if (otherPlayers[playerId]) {
                    otherPlayers[playerId].destroy();
                    delete otherPlayers[playerId];
                }
            });
        }

        function update() {
            if (myPlayer && targetX && targetY) {
                let distance = Phaser.Math.Distance.Between(myPlayer.x, myPlayer.y, targetX, targetY);
                if (distance > 5) {
                    let angle = Phaser.Math.Angle.Between(myPlayer.x, myPlayer.y, targetX, targetY);
                    myPlayer.x += Math.cos(angle) * 5;
                    myPlayer.y += Math.sin(angle) * 5;
                    socket.emit('move', { x: myPlayer.x, y: myPlayer.y });
                }
            }
        }
    </script>
</body>
</html>
